<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#ecomBg)" />

  <!-- Shopping Cart Illustration -->
  <g transform="translate(130, 110)">
    <!-- Cart Body -->
    <path d="M 10 30 L 40 30 L 75 140 L 190 140 L 215 65 L 55 65" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="85" cy="175" r="14" fill="#fbbf24" />
    <circle cx="180" cy="175" r="14" fill="#fbbf24" />
    <!-- Grid inside cart -->
    <line x1="90" y1="65" x2="105" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="125" y1="65" x2="135" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="160" y1="65" x2="165" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- Packages inside cart -->
    <rect x="75" y="15" width="45" height="45" rx="5" fill="#f59e0b" />
    <rect x="125" y="-5" width="55" height="65" rx="6" fill="#34d399" />
  </g>

  <!-- Sales Metrics Dashboard Card -->
  <g transform="translate(350, 75)">
    <rect x="0" y="0" width="205" height="250" rx="14" fill="rgba(0,0,0,0.35)" stroke="rgba(52,211,153,0.3)" stroke-width="1.5" />
    
    <text x="20" y="32" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">STORE REVENUE</text>
    <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900">₹84,50,000</text>
    <text x="20" y="80" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">▲ +186% Monthly</text>

    <line x1="20" y1="98" x2="185" y2="98" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <text x="20" y="124" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">CONVERSION RATE</text>
    <text x="20" y="148" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="900">3.85% (CRO)</text>

    <line x1="20" y1="168" x2="185" y2="168" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <text x="20" y="195" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">AVERAGE ORDER VALUE</text>
    <text x="20" y="222" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">₹2,840 (+34%)</text>
  </g>

  <rect x="50" y="45" width="180" height="32" rx="6" fill="rgba(255,255,255,0.1)" />
  <text x="140" y="66" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">E-COMMERCE MARKETING</text>
</svg>
