<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="seoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001824" />
      <stop offset="60%" stop-color="#002d3f" />
      <stop offset="100%" stop-color="#004d66" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8e8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#seoBg)" />
  <circle cx="500" cy="80" r="140" fill="#00a8e8" opacity="0.08" />
  <circle cx="100" cy="320" r="160" fill="#00e5ff" opacity="0.06" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="80" y1="60" x2="520" y2="60" />
    <line x1="80" y1="140" x2="520" y2="140" />
    <line x1="80" y1="220" x2="520" y2="220" />
    <line x1="80" y1="300" x2="520" y2="300" />
    <line x1="160" y1="40" x2="160" y2="340" />
    <line x1="280" y1="40" x2="280" y2="340" />
    <line x1="400" y1="40" x2="400" y2="340" />
  </g>

  <!-- Search Bar Card -->
  <rect x="100" y="80" width="400" height="60" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  <circle cx="140" cy="110" r="14" fill="none" stroke="#00e5ff" stroke-width="3" />
  <line x1="150" y1="120" x2="164" y2="134" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <text x="180" y="117" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">Search Engine Optimization (SEO)</text>
  <rect x="420" y="93" width="65" height="34" rx="6" fill="#008bb9" />
  <text x="452" y="115" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">RANK #1</text>

  <!-- Growth Bar Chart -->
  <g transform="translate(110, 180)">
    <rect x="20" y="90" width="36" height="50" rx="4" fill="rgba(0,168,232,0.3)" />
    <rect x="80" y="70" width="36" height="70" rx="4" fill="rgba(0,168,232,0.5)" />
    <rect x="140" y="45" width="36" height="95" rx="4" fill="rgba(0,168,232,0.7)" />
    <rect x="200" y="20" width="36" height="120" rx="4" fill="url(#tealGrad)" filter="url(#glow)" />
    <rect x="260" y="5" width="36" height="135" rx="4" fill="url(#tealGrad)" filter="url(#glow)" />

    <!-- Trend line -->
    <path d="M 38 85 Q 158 50 278 10" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="278" cy="10" r="6" fill="#f59e0b" />
  </g>

  <!-- Metric Badges -->
  <rect x="360" y="190" width="140" height="60" rx="8" fill="rgba(0,31,43,0.7)" stroke="#00a8e8" stroke-width="1.2" />
  <text x="375" y="214" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ORGANIC TRAFFIC</text>
  <text x="375" y="238" fill="#00e5ff" font-family="sans-serif" font-size="18" font-weight="800">+250% Growth</text>

  <rect x="360" y="265" width="140" height="55" rx="8" fill="rgba(0,31,43,0.7)" stroke="#f59e0b" stroke-width="1.2" />
  <text x="375" y="287" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOP 3 RANKINGS</text>
  <text x="375" y="308" fill="#f59e0b" font-family="sans-serif" font-size="17" font-weight="800">1,240+ Keywords</text>
</svg>
