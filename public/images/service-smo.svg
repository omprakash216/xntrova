<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="smoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#smoBg)" />

  <!-- Orbiting network bubbles -->
  <g stroke="rgba(236,72,153,0.2)" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <ellipse cx="300" cy="200" rx="220" ry="120" transform="rotate(-15 300 200)" />
    <ellipse cx="300" cy="200" rx="140" ry="70" transform="rotate(25 300 200)" />
  </g>

  <!-- Central Social Brand Core -->
  <circle cx="300" cy="200" r="54" fill="url(#instaGrad)" />
  <circle cx="300" cy="200" r="62" fill="none" stroke="rgba(236,72,153,0.5)" stroke-width="2" />
  
  <!-- Share / Heart icon in center -->
  <path d="M 300 216 L 285 200 C 275 190 275 178 286 174 C 294 171 298 176 300 179 C 302 176 306 171 314 174 C 325 178 325 190 315 200 Z" fill="#ffffff" />

  <!-- Node 1: Instagram/Reels -->
  <g transform="translate(140, 100)">
    <rect x="-35" y="-35" width="70" height="70" rx="18" fill="rgba(255,255,255,0.08)" stroke="#ec4899" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">INSTA</text>
    <text x="0" y="20" fill="#f472b6" font-family="sans-serif" font-size="10" text-anchor="middle">1.2M Reach</text>
  </g>

  <!-- Node 2: LinkedIn Authority -->
  <g transform="translate(460, 110)">
    <rect x="-35" y="-35" width="70" height="70" rx="18" fill="rgba(255,255,255,0.08)" stroke="#0ea5e9" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">LINKEDIN</text>
    <text x="0" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">B2B Leads</text>
  </g>

  <!-- Node 3: Viral Engagement -->
  <g transform="translate(200, 310)">
    <rect x="-40" y="-25" width="80" height="50" rx="12" fill="rgba(255,255,255,0.08)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="0" y="-3" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ENGAGEMENT</text>
    <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">+450%</text>
  </g>

  <!-- Node 4: Community -->
  <g transform="translate(420, 290)">
    <rect x="-40" y="-25" width="80" height="50" rx="12" fill="rgba(255,255,255,0.08)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="-3" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">COMMUNITY</text>
    <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">Verified</text>
  </g>

  <text x="300" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">SOCIAL MEDIA OPTIMIZATION</text>
</svg>
