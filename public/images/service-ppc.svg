<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ppcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1b4965" />
    </linearGradient>
    <linearGradient id="ppcAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#ppcBg)" />

  <!-- Target circles -->
  <circle cx="210" cy="200" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="210" cy="200" r="95" fill="none" stroke="rgba(0,186,220,0.25)" stroke-width="2" />
  <circle cx="210" cy="200" r="60" fill="none" stroke="rgba(245,158,11,0.4)" stroke-width="2.5" />
  <circle cx="210" cy="200" r="24" fill="url(#ppcAccent)" />

  <!-- Bullseye Arrow -->
  <line x1="260" y1="150" x2="216" y2="194" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <polygon points="212,198 226,192 218,184" fill="#ffffff" />

  <!-- Ad Performance Dashboard Card -->
  <g transform="translate(350, 70)">
    <rect x="0" y="0" width="200" height="260" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="16" y="16" width="34" height="18" rx="4" fill="#f59e0b" />
    <text x="33" y="29" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ADS</text>
    <text x="60" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Google &amp; Meta</text>

    <!-- Metrics -->
    <text x="16" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">RETURN ON AD SPEND</text>
    <text x="16" y="96" fill="#00e5ff" font-family="sans-serif" font-size="24" font-weight="900">4.8x ROAS</text>

    <line x1="16" y1="115" x2="184" y2="115" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <text x="16" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">AVG CONVERSION RATE</text>
    <text x="16" y="164" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">+312% Lift</text>

    <line x1="16" y1="182" x2="184" y2="182" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <text x="16" y="206" fill="#94a3b8" font-family="sans-serif" font-size="11">CUSTOMER ACQUISITION</text>
    <text x="16" y="228" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="700">-42% Cost (CAC)</text>
  </g>

  <!-- Tag Pill -->
  <rect x="50" y="60" width="160" height="34" rx="17" fill="rgba(0,186,220,0.15)" stroke="#00badc" stroke-width="1" />
  <text x="130" y="82" fill="#00e5ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">High-Converting PPC</text>
</svg>
