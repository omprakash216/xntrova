<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="contentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#contentBg)" />

  <!-- Document Card Mockup -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="220" height="270" rx="12" fill="#ffffff" />
    
    <!-- Document lines -->
    <rect x="24" y="24" width="90" height="14" rx="4" fill="#008bb9" />
    <rect x="24" y="52" width="170" height="8" rx="3" fill="#cbd5e1" />
    <rect x="24" y="68" width="150" height="8" rx="3" fill="#cbd5e1" />
    <rect x="24" y="84" width="165" height="8" rx="3" fill="#cbd5e1" />

    <!-- Image placeholder inside doc -->
    <rect x="24" y="108" width="172" height="70" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
    <circle cx="50" cy="135" r="12" fill="#f59e0b" />
    <path d="M 30 170 L 70 140 L 110 170 Z" fill="#94a3b8" />
    <path d="M 90 170 L 130 130 L 180 170 Z" fill="#64748b" />

    <!-- More lines -->
    <rect x="24" y="196" width="170" height="8" rx="3" fill="#cbd5e1" />
    <rect x="24" y="212" width="140" height="8" rx="3" fill="#cbd5e1" />
    <rect x="24" y="228" width="110" height="8" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Quill / Megaphone overlay -->
  <g transform="translate(360, 90)">
    <rect x="0" y="0" width="190" height="230" rx="14" fill="rgba(0,139,185,0.15)" stroke="#008bb9" stroke-width="1.5" />
    
    <text x="20" y="36" fill="#00e5ff" font-family="sans-serif" font-size="12" font-weight="700">EDITORIAL AUTHORITY</text>
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">High-Rank</text>
    <text x="20" y="96" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">Copywriting</text>

    <line x1="20" y1="120" x2="170" y2="120" stroke="rgba(255,255,255,0.15)" />

    <text x="20" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">ORGANIC BACKLINKS</text>
    <text x="20" y="168" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="800">500+ Earned</text>

    <text x="20" y="196" fill="#94a3b8" font-family="sans-serif" font-size="11">AVG TIME ON PAGE</text>
    <text x="20" y="218" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="700">4m 32s (+140%)</text>
  </g>
</svg>
