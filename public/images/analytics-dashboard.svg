<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001824" />
      <stop offset="50%" stop-color="#002b3d" />
      <stop offset="100%" stop-color="#003d52" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008bb9" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,229,255,0.3)" />
      <stop offset="100%" stop-color="rgba(0,229,255,0.0)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#dashBg)" />

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="rgba(255,255,255,0.04)" />
  <circle cx="36" cy="28" r="6" fill="#ef4444" />
  <circle cx="56" cy="28" r="6" fill="#f59e0b" />
  <circle cx="76" cy="28" r="6" fill="#10b981" />
  <text x="400" y="34" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Xntrova Marketing Intelligence Platform</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">ORGANIC REVENUE</text>
    <text x="20" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">₹4.82 Cr</text>
    <text x="140" y="62" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">▲ +254%</text>

    <rect x="250" y="0" width="220" height="90" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="270" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">QUALIFIED LEADS</text>
    <text x="270" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">14,890</text>
    <text x="390" y="62" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="700">▲ +180%</text>

    <rect x="500" y="0" width="220" height="90" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="520" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">AVERAGE ROAS</text>
    <text x="520" y="62" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">5.42x</text>
    <text x="640" y="62" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">★ Premier</text>
  </g>

  <!-- Big Interactive Growth Curve -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="720" height="260" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.08)" />

    <!-- Grid -->
    <line x1="40" y1="50" x2="680" y2="50" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="40" y1="110" x2="680" y2="110" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="40" y1="170" x2="680" y2="170" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4" />
    <line x1="40" y1="220" x2="680" y2="220" stroke="rgba(255,255,255,0.1)" />

    <!-- Area fill -->
    <path d="M 60 210 Q 180 180 300 130 T 540 70 T 660 30 L 660 220 L 60 220 Z" fill="url(#areaGrad)" />
    <!-- Line curve -->
    <path d="M 60 210 Q 180 180 300 130 T 540 70 T 660 30" fill="none" stroke="url(#curveGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Data Points -->
    <circle cx="60" cy="210" r="5" fill="#008bb9" />
    <circle cx="300" cy="130" r="6" fill="#00e5ff" stroke="#ffffff" stroke-width="2" />
    <circle cx="540" cy="70" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <circle cx="660" cy="30" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" />

    <text x="660" y="16" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">PEAK ROI</text>
  </g>
</svg>
